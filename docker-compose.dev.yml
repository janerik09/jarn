# Development overlay: live reload, source mounted into the containers, Vite dev server on port 5173,
# and the database, Redis and API ports published on the host.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
services:
  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  backend:
    build:
      args:
        INSTALL_DEV: "1"
    ports:
      - "0.0.0.0:8000:8000"
    volumes:
      - ./backend:/app
      - ./tls:/tls
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DEBUG: "true"
      ENVIRONMENT: development

  worker:
    volumes:
      - ./backend:/app

  beat:
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend-web
      dockerfile: Dockerfile
    container_name: patching-frontend
    ports:
      - "0.0.0.0:5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend-web:/app
      - /app/node_modules
    command: npm run dev
