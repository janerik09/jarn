# Runs on every push and pull request. Each job must pass before a change is merged.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests and dependency audit
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: patching_user
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: patching_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U patching_user -d patching_db"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://patching_user:ci-only-password@localhost:5432/patching_db
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-only-secret-key-that-is-long-enough-1234567890
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt pip-audit
      - name: Known vulnerabilities in Python dependencies
        working-directory: backend
        run: pip-audit -r requirements.txt --progress-spinner off
      - name: Tests
        working-directory: backend
        run: |
          # A fresh throwaway key for this run only
          echo "CREDENTIAL_ENCRYPTION_KEY=$(python -c "import base64,os;print(base64.urlsafe_b64encode(os.urandom(32)).decode())")" >> "$GITHUB_ENV"
          python -m pytest -q

  frontend:
    name: Frontend build and dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-web/package-lock.json
      - run: npm ci
      - name: Known vulnerabilities in npm dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Type check and production build
        run: npm run build

  images:
    name: Container images, scan and SBOM
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      # Trivy runs from its own image, pinned by digest, so no third-party action is needed
      TRIVY: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.58.1@sha256:ab70a02200597efa04748f210f793936eb647cbcdb0ea69cc30b226d6f5a22c7
    steps:
      - uses: actions/checkout@v7
      - name: Build backend image
        run: docker build -t jarn-backend:ci backend
      - name: Build web image
        run: docker build -f deploy/nginx/Dockerfile -t jarn-web:ci .
      - name: Scan backend image (fails on high or critical findings with a fix)
        run: $TRIVY image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 jarn-backend:ci
      - name: Scan web image (fails on high or critical findings with a fix)
        run: $TRIVY image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 jarn-web:ci
      - name: Software bill of materials (CycloneDX)
        run: $TRIVY image --format cyclonedx --output /dev/stdout jarn-backend:ci > sbom-backend.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom-backend.cdx.json

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    # Read-only on purpose. Dependabot pull requests get a read-only token that the workflow cannot widen, so the
    # scan runs the gitleaks command over the checked-out history and does not call the GitHub API.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan the full git history
        run: docker run --rm -v "$GITHUB_WORKSPACE:/repo" zricethezav/gitleaks:v8.24.3 git /repo --config /repo/.gitleaks.toml --redact --exit-code 1 --no-banner
