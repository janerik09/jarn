# Runs on every push and pull request. Each job must pass before a change is merged.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests and dependency audit
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: patching_user
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: patching_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U patching_user -d patching_db"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://patching_user:ci-only-password@localhost:5432/patching_db
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-only-secret-key-that-is-long-enough-1234567890
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt pip-audit
      - name: Known vulnerabilities in Python dependencies
        working-directory: backend
        run: pip-audit -r requirements.txt --progress-spinner off
      - name: Tests
        working-directory: backend
        run: |
          # A fresh throwaway key for this run only
          echo "CREDENTIAL_ENCRYPTION_KEY=$(python -c "import base64,os;print(base64.urlsafe_b64encode(os.urandom(32)).decode())")" >> "$GITHUB_ENV"
          python -m pytest -q

  frontend:
    name: Frontend build and dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-web/package-lock.json
      - run: npm ci
      - name: Known vulnerabilities in npm dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Type check and production build
        run: npm run build

  images:
    name: Container images, scan and SBOM
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t jarn-backend:ci backend
      - name: Build web image
        run: docker build -f deploy/nginx/Dockerfile -t jarn-web:ci .
      - name: Scan backend image (fails on high or critical findings)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: jarn-backend:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: Scan web image (fails on high or critical findings)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: jarn-web:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: Software bill of materials (CycloneDX)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: jarn-backend:ci
          format: cyclonedx
          output: sbom-backend.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom-backend.cdx.json

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
