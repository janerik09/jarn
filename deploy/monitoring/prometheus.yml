# Scrapes JÁRN's backend on the internal Docker network. If METRICS_TOKEN is set in .env, also add
#   authorization: { type: Bearer, credentials_file: /etc/prometheus/metrics_token }
# to the job below and mount that file. Start with:
#   docker compose --profile monitoring up -d prometheus
global:
  scrape_interval: 60s
  evaluation_interval: 60s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: jarn
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]
